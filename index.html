<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Guest Matrix</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background:
        radial-gradient(900px 420px at 12% -8%, #ffe566 0%, transparent 55%),
        linear-gradient(180deg, #ffd400 0%, #ffcc00 42%, #f0b400 100%);
      color: #3d2412;
    }
    .page-survey {
      min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
    }
    .page-survey.start { gap: 8px; }
    .shell { width: 100%; max-width: min(420px, 92vw); }
    .card {
      width: 100%; background: #fffef8; border-radius: 24px;
      padding: 28px 18px 18px; text-align: center;
      border: 1px solid rgba(255, 255, 255, .7);
      box-shadow: 0 18px 40px rgba(140, 90, 0, .22);
    }
    .logo { width: 44px; height: 44px; margin: 0 auto 8px; display: block; }
    .logo.out { width: 52px; height: 52px; margin: 0 auto; filter: drop-shadow(0 6px 12px rgba(120, 70, 0, .25)); }
    .sub { color: #b45309; font-size: 12px; margin-bottom: 6px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    h1 { color: #3d2914; font-size: clamp(17px, 5vw, 20px); line-height: 1.3; margin-bottom: 12px; font-weight: 800; }
    .nav { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .next {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      background: linear-gradient(180deg, #f5c518, #d9a400); color: #fff; border: 0; border-radius: 12px;
      padding: 0 16px; min-height: 44px; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
      box-shadow: 0 8px 16px rgba(180, 120, 0, .28); width: 100%;
    }
    .ico { width: 18px; height: 18px; display: block; }
    .visit {
      align-self: flex-end; width: 100%; max-width: min(420px, 92vw);
      text-align: right; font-size: 12px; color: #6b4e00; padding-top: 6px; font-weight: 600;
    }
  </style>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
</head>
<body>
  <div id="root"></div>
  <script>
    (function () {
      var path = (location.pathname || '').replace(/\/+$/, '') || '/';
      if (path.indexOf('/b/') !== 0 && (location.search || '').indexOf('branch=') === -1) return;
      document.getElementById('root').innerHTML =
        '<div class="page-survey start">' +
          '<svg class="logo out" viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#fff4e5"></circle><text x="32" y="40" text-anchor="middle" font-size="28">🍔</text></svg>' +
          '<div class="shell"><div class="card">' +
            '<div class="body">' +
              '<p class="sub">Thank you for visiting Guest Matrix!</p>' +
              '<h1>Your feedback is valuable to us! Please fill in this 30 second survey :)</h1>' +
            '</div>' +
            '<div class="nav"><button class="next" type="button">Next <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button></div>' +
          '</div></div>' +
          '<p class="visit">Thank You For Visiting Us!</p>' +
        '</div>';
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>

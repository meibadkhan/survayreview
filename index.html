<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CrispyGo Survey</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100dvh;
      display: flex; align-items: stretch; justify-content: center;
      background: #f97316; font-family: Inter, system-ui, sans-serif;
      padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    }
    .shell { width: 100%; max-width: 430px; display: flex; flex-direction: column; }
    .card {
      flex: 1; width: 100%; background: #fff; border-radius: 20px;
      padding: 22px 18px 16px; text-align: center;
      display: flex; flex-direction: column; min-height: calc(100dvh - 52px);
    }
    .body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .logo { width: 52px; height: 52px; margin: 0 auto 12px; }
    .sub { color: #8a6a4a; font-size: 13px; margin-bottom: 8px; }
    h1 { color: #3d2412; font-size: clamp(18px, 5.4vw, 22px); line-height: 1.35; margin-bottom: 18px; }
    .opts { display: flex; flex-direction: column; gap: 8px; text-align: left; margin-bottom: 12px; }
    .opt { border: 1.5px solid #e8e0d8; border-radius: 12px; padding: 14px; min-height: 48px; display: flex; align-items: center; color: #4a3a2a; background: #fff; }
    .opt.on { background: #fff3e6; border-color: #f97316; }
    textarea, input, select { width: 100%; border: 1.5px solid #e8e0d8; border-radius: 12px; padding: 14px; font-size: 16px; }
    textarea { min-height: 120px; resize: vertical; margin-bottom: 12px; }
    .fields { text-align: left; margin-bottom: 12px; }
    .fields input { margin-bottom: 10px; }
    .phone { display: flex; gap: 8px; }
    .phone select { width: 88px; flex-shrink: 0; }
    .phone input { flex: 1; min-width: 0; margin: 0; }
    .nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-top: 10px; }
    .back { background: none; border: 0; color: #3d2412; font: inherit; font-size: 16px; min-height: 48px; padding: 0 4px; }
    .next { background: #f97316; color: #fff; border: 0; border-radius: 12px; padding: 0 20px; min-height: 48px; font: inherit; font-size: 16px; font-weight: 600; margin-left: auto; }
    .next.wide { width: 100%; margin: 0; }
    .next:disabled { opacity: .45; }
    .meta { color: #5a4030; font-size: 13px; line-height: 1.6; word-break: break-all; }
    .admin { display: block; margin-top: 8px; color: #fff; font-size: 12px; text-align: center; padding: 6px; }
    @media (min-width: 500px) {
      body { align-items: center; }
      .card { flex: none; min-height: 560px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card" id="app"></div>
    <a class="admin" href="admin.html">Admin dashboard</a>
  </div>
  <script>
    const logo = `<svg class="logo" viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#fff4e5"/><text x="32" y="40" text-anchor="middle" font-size="28">🍔</text></svg>`;
    let S, step = 0, answers = {};

    fetch('survey.json').then(r => r.json()).then(start);

    function start(data) {
      S = data;
      S.questions.forEach(q => {
        answers[q.id] = q.type === 'text' ? '' : q.type === 'contact' ? { order: '', code: '+92', phone: '' } : [];
      });
      draw();
    }

    function pick(q, opt) {
      if (q.isMultiple) {
        const i = answers[q.id].indexOf(opt);
        i < 0 ? answers[q.id].push(opt) : answers[q.id].splice(i, 1);
      } else {
        answers[q.id] = [opt];
      }
      draw();
    }

    function ready() {
      if (step === 0) return true;
      const q = S.questions[step - 1];
      if (!q) return true;
      return q.type === 'text' || q.type === 'contact' || q.optional ? true : answers[q.id].length > 0;
    }

    function go(n) {
      step += n;
      if (step > S.questions.length) save();
      draw();
    }

    function save() {
      const id = 'sbm_' + Math.random().toString(16).slice(2) + Date.now().toString(16);
      const at = new Date().toISOString();
      const list = JSON.parse(localStorage.getItem('surveys') || '[]');
      list.unshift({
        id, at,
        answers: S.questions.map(q => {
          let value = answers[q.id];
          if (q.type === 'contact') {
            const c = answers[q.id];
            value = [c.order && 'Order ' + c.order, c.phone && (c.code + ' ' + c.phone)].filter(Boolean).join(' · ');
          }
          return { id: q.id, text: q.text, isMultiple: q.isMultiple, value };
        })
      });
      localStorage.setItem('surveys', JSON.stringify(list));
      window._done = { id, at };
    }

    function draw() {
      const el = document.getElementById('app');
      if (step === 0) {
        el.innerHTML = `<div class="body">${logo}<p class="sub">${S.welcomeSub}</p><h1>${S.welcomeTitle}</h1></div>
          <div class="nav"><button class="next wide" onclick="go(1)">Next →</button></div>`;
        return;
      }
      if (step > S.questions.length) {
        const d = new Date(window._done.at);
        el.innerHTML = `<div class="body"><h1>${S.thanks}</h1>${logo}
          <p class="meta">Survey completed at ${d.toLocaleString()}<br>${window._done.id}</p></div>`;
        return;
      }
      const q = S.questions[step - 1];
      let body = '';
      if (q.type === 'text') {
        body = `<textarea placeholder="${q.placeholder || ''}" oninput="answers['${q.id}']=this.value">${answers[q.id]}</textarea>`;
      } else if (q.type === 'contact') {
        const c = answers[q.id];
        body = `<div class="fields">
          <input placeholder="Order Number" value="${c.order}" oninput="answers['${q.id}'].order=this.value">
          <div class="phone">
            <select onchange="answers['${q.id}'].code=this.value">
              ${['+92','+1','+44','+971'].map(x => `<option${c.code===x?' selected':''}>${x}</option>`).join('')}
            </select>
            <input placeholder="Phone Number" value="${c.phone}" oninput="answers['${q.id}'].phone=this.value">
          </div>
        </div>`;
      } else {
        body = `<div class="opts">${q.options.map(o =>
          `<div class="opt${answers[q.id].includes(o) ? ' on' : ''}" onclick='pick(S.questions[step-1], ${JSON.stringify(o)})'>${o}</div>`
        ).join('')}</div>`;
      }
      el.innerHTML = `<div class="body">${logo}<p class="sub">${q.label}</p><h1>${q.text}</h1>${body}</div>
        <div class="nav">
          <button class="back" onclick="go(-1)">← Previous</button>
          <button class="next" ${ready() ? '' : 'disabled'} onclick="go(1)">${step === S.questions.length ? 'Submit →' : 'Next →'}</button>
        </div>`;
    }
  </script>
</body>
</html>
